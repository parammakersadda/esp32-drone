<!DOCTYPE html>
<html>

<head>
<title>Drone Controller</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h1>ESP32 Drone</h1>
<h2>
Battery:
<span id="batteryPercent">--</span>%
</h2>

<p>
Voltage:
<span id="batteryVoltage">--</span>V
</p>

<button id="armButton" onclick="armDoubleTap()">
    DISARMED
</button>

<span id="armHint">
    Double tap to arm
</span>

<p>Throttle</p>

<input 
type="range"
min="1000"
max="2000"
value="1000"
id="slider">

<span id="value">1000</span>

<br><br>

<a href="/config">Motor Configuration</a>
<style>
#armButton
{
    background-color: red;
    color: white;
    padding: 15px;
    font-size: 20px;
}

#armHint
{
    margin-left: 10px;
    color: gray;
}
</style>


<script>

const slider =
document.getElementById("slider");

const value =
document.getElementById("value");


slider.oninput = function()
{
    value.innerHTML=this.value;

    fetch(
        "/throttle?value="+this.value
    );
}


let lastTap = 0;
let armed = false;


function armDoubleTap()
{
    let now = Date.now();


    if(armed)
    {
        // Already armed: single tap disarms immediately
        armed = false;

        fetch("/arm?state=0");

        updateArmButton();

        return;
    }


    // Currently disarmed: require double tap to arm
    if(now - lastTap < 500)
    {
        armed = true;

        fetch("/arm?state=1");

        updateArmButton();

        lastTap = 0;
        return;
    }


    lastTap = now;
}

function updateArmButton()
{
    let btn = document.getElementById("armButton");


    if(armed)
    {
        btn.innerHTML = "ARMED";
        btn.style.backgroundColor = "green";
    }
    else
    {
        btn.innerHTML = "DISARMED";
        btn.style.backgroundColor = "red";
    }
}
function updateBattery()
{
    fetch("/battery")
    .then(response =>
    {
        if(!response.ok)
            throw new Error("ESP32 not responding");

        return response.json();
    })
	.then(data =>
	{
	    document.getElementById("batteryVoltage").innerHTML =
		data.voltage.toFixed(2);

	    document.getElementById("batteryPercent").innerHTML =
		data.percentage;
	})
    .catch(error =>
    {
        document.getElementById("batteryVoltage").innerHTML =
            "Not available";

        document.getElementById("batteryPercent").innerHTML =
            "Not available";
    });
}

setInterval(
    updateBattery,
    1000
);

updateBattery();

</script>

</body>
</html>
